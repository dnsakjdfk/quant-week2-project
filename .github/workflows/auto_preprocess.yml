name: Auto Data Preprocess Pipeline
on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  run_preprocess:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy newsapi-python textblob nltk pyarrow

      - name: 执行数据预处理脚本
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python week2.py

      - name: 提交更新后的数据集回仓库
        run: |
          git config --global user.name "AutoPipelineBot"
          git config --global user.email "bot@github.com"
          git add processed_data.csv processed_data.parquet
          git commit -m "Auto update processed dataset via GitHub Actions schedule" || echo "无数据更新，跳过提交"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送变更
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
